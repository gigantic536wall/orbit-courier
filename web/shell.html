<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Courier</title>
  <meta name="description" content="Gravity-assist delivery game written in C++20 and compiled to WebAssembly.">
  <style>
    html, body { margin: 0; height: 100%; background: #070b14; color: #dce2f0; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; outline: none; }
    #status { position: absolute; font-size: 14px; opacity: .7; }
    footer { position: fixed; bottom: 6px; font-size: 12px; opacity: .45; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <footer>C++20 · raylib · WebAssembly · <a href="https://github.com/gigantic536wall/orbit-courier">source code</a></footer>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) {
        var el = document.getElementById('status');
        el.textContent = text;
        el.style.display = text ? 'block' : 'none';
      },
      // CI replaces __BUILD__ with the commit id, so a new deploy never mixes with cached files.
      locateFile: function (path) { return path + '?v=__BUILD__'; },
      onRuntimeInitialized: function () { document.getElementById('canvas').focus(); }
    };
    window.addEventListener('keydown', function (e) {
      if ([' ', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
